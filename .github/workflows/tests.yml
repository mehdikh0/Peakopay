name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: Backend + plugin + e2e (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, pdo_mysql, mysql, openssl, sodium

      - name: Create test databases
        run: |
          mysql --host 127.0.0.1 --user root --password root -e "
            CREATE USER IF NOT EXISTS 'hp'@'localhost' IDENTIFIED BY 'hp_test_pass';
            CREATE USER IF NOT EXISTS 'hp'@'127.0.0.1' IDENTIFIED BY 'hp_test_pass';
            CREATE DATABASE IF NOT EXISTS peakopay_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS peakopay_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL ON peakopay_test.* TO 'hp'@'localhost';
            GRANT ALL ON peakopay_e2e.* TO 'hp'@'localhost';
            GRANT ALL ON peakopay_test.* TO 'hp'@'127.0.0.1';
            GRANT ALL ON peakopay_e2e.* TO 'hp'@'127.0.0.1';
            FLUSH PRIVILEGES;"

      - name: Run full test suite (745 checks)
        run: php tests/run.php
